<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0c">
    <title>Hygiene Station Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.04);
            --accent: #4ade80; 
            --danger: #ef4444;
            --text-main: #f4f4f5;
            --text-dim: #a1a1aa;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1c1c21 0%, #0a0a0c 100%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2.5rem 1.5rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        
        header h1 { font-size: 1.8rem; letter-spacing: -1px; line-height: 1; }
        #live-clock { color: var(--accent); font-weight: 600; font-size: 0.9rem; margin-top: 5px; }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 1.5rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.1s;
            flex: 1;
            max-height: 140px;
        }

        .card:active { transform: scale(0.98); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .icon-box {
            width: 42px; height: 42px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        /* SVG Sizing */
        .icon-box svg {
            width: 24px;
            height: 24px;
        }

        .status-badge {
            font-size: 0.65rem; font-weight: 700;
            padding: 4px 10px; border-radius: 20px;
            background: rgba(74, 222, 128, 0.1); color: var(--accent);
        }

        .card h3 { font-size: 1.1rem; margin-bottom: 4px; }
        .card p { color: var(--text-dim); font-size: 0.8rem; line-height: 1.2; }

        .progress-bar {
            height: 5px; background: rgba(255,255,255,0.1);
            border-radius: 10px; margin: 8px 0; overflow: hidden;
        }
        .progress-fill { height: 100%; background: var(--accent); width: 85%; }

        .emergency-btn {
            border: 1px solid rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.08);
        }

        nav {
            margin: 20px auto 30px;
            width: 85%;
            background: rgba(20, 20, 25, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            display: flex; 
            justify-content: space-around; 
            padding: 12px;
        }

        .nav-item { color: var(--text-dim); font-size: 0.7rem; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--text-main); }
        .nav-item svg { width: 20px; height: 20px; display: block; margin: 0 auto 4px; }

        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 1000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #18181b; border: 1px solid var(--glass-border);
            width: 100%; border-radius: 30px; padding: 2.5rem 2rem; text-align: center;
        }
        .btn-close {
            margin-top: 2rem; width: 100%; padding: 15px;
            border-radius: 15px; border: none; font-weight: 700; background: #fff; color: #000;
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Hygiene Station</h1>
        <div id="live-clock">00:00:00</div>
    </div>
    <div class="status-badge" style="background: rgba(255,255,255,0.05); color: white;">ID: KV-01</div>
</header>

<div class="container">
    <div class="card" onclick="openModal('UV-C Status', 'System: Ready\nLast Cycle: 10m ago')">
        <div class="card-header">
            <div class="icon-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </div>
            <div class="status-badge">ACTIVE</div>
        </div>
        <h3>UV-C Sterilizer</h3>
        <p>Auto-cycle running. No motion detected.</p>
    </div>

    <div class="card" onclick="openModal('Sanitizer Info', 'Fluid: Gel Type\nCapacity: 85%')">
        <div class="card-header">
            <div class="icon-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V7a5 5 0 0 1 10 0v4"/><rect x="5" y="11" width="14" height="10" rx="2"/></svg>
            </div>
            <div class="status-badge" style="color: #fbbf24; background: rgba(251,191,36,0.1);">85%</div>
        </div>
        <h3>Sanitizer Gel</h3>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <p>Level is healthy. Ready to dispense.</p>
    </div>

    <div class="card emergency-btn" onclick="openModal('EMERGENCY STOP', 'All operations have been suspended immediately.')">
        <div class="card-header">
            <div class="icon-box" style="background: rgba(239, 68, 68, 0.2);">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
            <div class="status-badge" style="color: var(--danger); background: transparent;">HALT</div>
        </div>
        <h3>Emergency Stop</h3>
        <p>Tap to deactivate all components.</p>
    </div>
</div>

<nav>
    <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
    </div>
    <div class="nav-item" onclick="openModal('History', 'Latest logs loaded.')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Logs
    </div>
    <div class="nav-item" onclick="openModal('Settings', 'Calibration access.')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Setup
    </div>
</nav>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="modal-title"></h2>
        <p id="modal-text" style="margin-top: 15px; color: var(--text-dim); white-space: pre-line;"></p>
        <button class="btn-close" onclick="closeModal()">Dismiss</button>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit', hour12: false});
    }
    setInterval(updateClock, 1000);
    updateClock();

    function openModal(title, text) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-text').innerText = text;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }
</script>

</body>
</html>
